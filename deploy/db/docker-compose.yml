services:
  db:
    image: postgres:17
    restart: unless-stopped
    command: >
      postgres
      -c ssl=on
      -c ssl_cert_file=/certs/server.crt
      -c ssl_key_file=/certs/server.key
    environment:
      POSTGRES_USER: markfdev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: markfdev
    ports:
      - "57.129.162.52:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U markfdev -d markfdev"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
