# Canonical site: https://markf.dev. Everything else redirects to it.
# Blazor Server needs WebSocket upgrades and long-lived connections.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream markfdev_app {
    server 57.129.162.53:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name markf.dev www.markf.dev markf.io www.markf.io;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://markf.dev$request_uri; }
}

# Non-canonical hosts
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.markf.dev markf.io www.markf.io;

    ssl_certificate     /etc/letsencrypt/live/markf.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/markf.dev/privkey.pem;

    return 301 https://markf.dev$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name markf.dev;

    ssl_certificate     /etc/letsencrypt/live/markf.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/markf.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        proxy_pass http://markfdev_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 100s;
        proxy_buffering off;
    }
}
