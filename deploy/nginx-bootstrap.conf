# Bootstrap config: serves only the ACME challenge so certbot can issue certificates.
# Replace with markf.dev.conf once certificates exist.
server {
    listen 80;
    listen [::]:80;
    server_name markf.dev www.markf.dev markf.io www.markf.io;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}
